name: bvh-perf

# BVH/遍历性能测量（Dynamic GI 标准场景，TestVulkanSponzaRenderGraph，
# timing-only + RG per-pass GPU timestamp）。只报告，不卡性能门：
# 仅 harness 崩溃/看门狗杀进程/二进制缺失才失败。
#
# ⚠️ GitHub Actions 的 schedule 只在默认分支（master）上的 workflow 文件生效。
# 本文件必须以单独提交落在 master；被测代码通过 checkout 的 ref 输入选择
# （默认 dev——实现已合入 dev，夜跑固定测 dev），与 runner 持久工作区上的 build-bvhperf 增量树配合。
#
# 平台策略（2026-11-25 拍板）：Windows 自托管 runner（有 GPU）+ macOS 仅本地
# 测量（scripts/perf/run_bvh_perf.sh，不注册 runner）。

on:
  schedule:
    - cron: '0 18 * * *'   # 每日 02:00 北京时间（18:00 UTC）
  workflow_dispatch:
    inputs:
      ref:
        description: '被测分支/commit（默认 dev）'
        required: false
        default: 'dev'
      groups:
        description: '测量组（逗号分隔：gi0,dyn-gi,dyn-gi-sah,dyn-gi-upper,dyn-gi-lbvh,dyn-gi-hlbvh）'
        required: false
        default: 'gi0,dyn-gi,dyn-gi-sah,dyn-gi-upper,dyn-gi-lbvh,dyn-gi-hlbvh'
      frames:
        description: '每组帧数'
        required: false
        default: '420'
      mode:
        description: 'full=完整链（默认）；build=配置+编译不跑组；configure=只验 configure（~2分钟，清空 build 目录）'
        required: false
        default: 'full'

permissions:
  contents: read

concurrency:
  group: bvh-perf
  cancel-in-progress: false

jobs:
  bvh-perf-windows:
    name: BVH perf (Windows / Vulkan / Dynamic GI)
    runs-on: [self-hosted, Windows, X64, D3D12, Vulkan]
    timeout-minutes: 60
    steps:
      - name: Checkout (persisted clone, retry x5, selectable ref)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $ws  = $env:GITHUB_WORKSPACE
          $url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          $ref = '${{ inputs.ref }}'
          if (-not $ref) { $ref = 'dev' }
          $max = 5
          git config --global --add safe.directory "$ws" 2>$null | Out-Null
          $done = $false
          for ($i = 1; $i -le $max -and -not $done; $i++) {
            Write-Host "::group::checkout attempt $i/$max ref=$ref"
            $rc = 0
            if (Test-Path "$ws/.git") {
              git -C $ws fetch --depth 1 origin $ref
              $rc = $LASTEXITCODE
              if ($rc -eq 0) { git -C $ws checkout --detach --force FETCH_HEAD; $rc = $LASTEXITCODE }
            } else {
              Get-ChildItem $ws -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
              git clone --depth 1 --no-checkout $url $ws
              $rc = $LASTEXITCODE
              if ($rc -eq 0) {
                git -C $ws fetch --depth 1 origin $ref; $rc = $LASTEXITCODE
                if ($rc -eq 0) { git -C $ws checkout --detach --force FETCH_HEAD; $rc = $LASTEXITCODE }
              }
            }
            if ($rc -eq 0) {
              # meshopt pin 只在本机（回退物化见下）；VHACD 无 .gitmodules 映射。
              # 与 windows-parity 同一套排除清单。
              git -C $ws submodule update --init --recursive --depth 1 -- ':(exclude)third_party/meshoptimizer' ':(exclude)third_party/VHACD'
              $rc = $LASTEXITCODE
            }
            Write-Host "::endgroup::"
            if ($rc -eq 0) { $done = $true } else {
              Write-Host "::warning::checkout attempt $i failed (rc=$rc); backing off"
              Start-Sleep -Seconds (20 * $i)
            }
          }
          if (-not $done) { Write-Host "::error::checkout failed after $max attempts"; exit 1 }
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/ci_meshopt_fallback.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $ws rev-parse HEAD
          Write-Output "BVH_PERF_REF=$ref" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cleanup stale run outputs (R28 教训)
        shell: powershell
        run: |
          # self-hosted checkout 不做 git clean；先清零上轮产物，避免
          # 失败 run 把上一轮报告当本轮证据上传。
          # bvh-out：独立输出根（不寄生在共享 ci-out/ 下——parity 的清理步骤
          # 会 Remove-Item ci-out 整目录，曾把本 job 的 exe-path 连环端掉，
          # 2026-11-27 run 45986246770 Locate 假死根因）。
          if (Test-Path bvh-out) {
            Remove-Item bvh-out -Recurse -Force -ErrorAction SilentlyContinue
            Write-Output "[cleanup] stale bvh-out removed"
          }
          "# BVH perf run`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- ref: $env:BVH_PERF_REF`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- commit: ${{ github.sha }}`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- runner: $env:COMPUTERNAME`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "- report-only：数值回归不标红；组失败/harness 崩溃才 fail`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Preflight (tools + assets)
        shell: powershell
        run: |
          $fail = $false
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) { Write-Host "::error::cmake not found"; $fail = $true }
          if (-not (Get-Command python -ErrorAction SilentlyContinue) -and -not (Get-Command py -ErrorAction SilentlyContinue)) { Write-Host "::error::python not found"; $fail = $true }
          $asset = if ($env:PRIMAL_CI_ASSET_DIR) { $env:PRIMAL_CI_ASSET_DIR } elseif ($env:PRIMAL_CI_ASSET_SOURCE) { $env:PRIMAL_CI_ASSET_SOURCE } else { $null }
          if (-not $asset -or -not (Test-Path $asset)) {
            Write-Host "::error::Sponza 资产目录缺失：请设 PRIMAL_CI_ASSET_DIR/PRIMAL_CI_ASSET_SOURCE（与 windows-parity 同一套 runner 机 env）"
            $fail = $true
          }
          if ($env:PRIMAL_CI_THIRD_PARTY_DIR -and -not (Test-Path $env:PRIMAL_CI_THIRD_PARTY_DIR)) {
            Write-Host "::error::PRIMAL_CI_THIRD_PARTY_DIR 不存在"; $fail = $true
          }
          if ($env:PRIMAL_CI_SDK_MODULES -and -not (Test-Path $env:PRIMAL_CI_SDK_MODULES)) {
            Write-Host "::error::PRIMAL_CI_SDK_MODULES 不存在"; $fail = $true
          }
          if (-not $env:VULKAN_SDK) { Write-Host "::warning::VULKAN_SDK 未设（Vulkan loader 仍可能经默认路径找到）" }
          if ($fail) { exit 1 }

      - name: Configure CMake (VS2022 x64 Release, Vulkan-only, 独立 build-bvhperf)
        shell: powershell
        run: |
          # GH Actions 的 PowerShell 步骤默认 ErrorActionPreference=Stop；
          # native stderr 经 2>&1 变 ErrorRecord，Stop 下首个 stderr 行即 throw。
          $ErrorActionPreference = 'Continue'
          # 探针：验证注解通道本身是否工作（匿名 API 可读 /check-runs/annotations）。
          Write-Host "::notice::cfg-probe step5 enter"
          try {
            $m = '${{ inputs.mode }}'
            if ($m -eq 'configure') {
              Write-Output "[mode=configure] 清空 build-bvhperf——干净 configure 快验"
              if (Test-Path build-bvhperf) { Remove-Item build-bvhperf -Recurse -Force -ErrorAction SilentlyContinue }
            }
            # 独立目录：不碰 windows-parity 的 build-winparity（并发/缓存互不污染）。
            # 显式 ON：build 目录跨 run 持久，CMakeCache 残留的 OFF 不会因旗标缺席翻转。
            # BUILD_CONTENT_TOOLS 必须 ON——IntegrationTests 的可执行目标挂在
            # if(TARGET ContentTools) 下（2026-11-25 worktree 实证）。
            # 离线依赖：OFFLINE_DEPS 未设时走网络 FetchContent（parity 同机同 env
            # configure 绿，网络 zlib 可用；本地源保留为可选加速）。
            $extra = @()
            # 路径归一化（2026-11-27 用户实物判读定案）：PRIMAL_CI_SDK_MODULES 是
            # Windows 反斜杠分号列表（C:\Users\...），-DCMAKE_MODULE_PATH 原样传入
            # 后被写进 try_compile scratch 工程的 set()，反斜杠 \U（\Users）被
            # CMake 判非法转义 → ABI 探测语法错（run 45956251046 实物）。全部转
            # 正斜杠、保留分号分隔。缓存目录（parity/ci）不重写 scratch 工程，
            # 故同机老树一直绿——只有全新目录踩中。
            if ($env:PRIMAL_CI_SDK_MODULES) {
              $mods = $env:PRIMAL_CI_SDK_MODULES -replace '\\', '/'
              Write-Host "::notice::sdk-modules normalized=$mods"
              $extra += "-DCMAKE_MODULE_PATH=$mods"
            }
            if ($env:PRIMAL_CI_OFFLINE_DEPS) {
              $zl = Join-Path $env:PRIMAL_CI_OFFLINE_DEPS 'zlib-src'
              if (Test-Path (Join-Path $zl 'CMakeLists.txt')) {
                # 同类雷预防：-D 传入的本地源路径同样归一化正斜杠。
                $extra += "-DPRIMAL_ZLIB_SOURCE_DIR=$(([IO.Path]::GetFullPath($zl)) -replace '\\', '/')"
              }
            }
            # 机器 env 编译器旗标隔离（2026-11-27 run 45956251046 实物判读）：
            # 全新目录的 MSVC ABI try_compile 挂在 scratch 工程的 set() 语法错，
            # 典型病因是机器级 CC/CXX/CFLAGS/CXXFLAGS/LDFLAGS/_CL_/_LINK_（为
            # 其他工具链设的值）渗进 try_compile。VS 生成器不需要这些 env
            # （cl.exe 经 vswhere 定位），清掉即恢复默认行为；原值打注解留证。
            $polluters = 'CC','CXX','CFLAGS','CXXFLAGS','LDFLAGS','CPPFLAGS','_CL_','_LINK_',
                         'CMAKE_GENERATOR','CMAKE_TOOLCHAIN_FILE','VCPKG_ROOT'
            foreach ($p in $polluters) {
              $v = [Environment]::GetEnvironmentVariable($p)
              if ($v) {
                $escaped = $v -replace '%','%25' -replace "\r","%0D" -replace "\n","%0A"
                Write-Host "::notice::env-polluter $p=$escaped"
                Remove-Item -Path "Env:$p" -ErrorAction SilentlyContinue
              }
            }
            $cmakeArgs = @('-S', '.', '-B', 'build-bvhperf',
                           '-G', 'Visual Studio 17 2022', '-A', 'x64',
                           '-DCMAKE_BUILD_TYPE=Release',
                           '-DENABLE_VULKAN=ON',
                           '-DENABLE_D3D12=OFF',
                           '-DBUILD_CONTENT_TOOLS=ON') + $extra
            # 先整体捕获再落盘：无流式管道依赖，$lines 直接喂注解，log 文件存在性
            # 不再是失败路径上的变量（2026-11-27 dispatch 45929556164 注解缺席教训）。
            $output = & cmake @cmakeArgs 2>&1
            $code = $LASTEXITCODE
            $output | Out-File 'cmake-bvhperf.log' -Encoding utf8
            $lines = @($output | ForEach-Object { $_.ToString() })
            Write-Output "configure exit code: $code; total lines: $($lines.Count); tail:"
            $lines | Select-Object -Last 50 | ForEach-Object { Write-Output $_ }
            Get-Content 'cmake-bvhperf.log' -ErrorAction SilentlyContinue | Select-Object -Last 40 |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            if ($code -ne 0) {
              # 命中行 + 后 2 行上下文一起注解（set/try_compile 的具体原因在次行）。
              $idx = for ($k = 0; $k -lt $lines.Count; $k++) {
                if ($lines[$k] -match 'CMake Error|FATAL_ERROR|Configuring incomplete|Could NOT find|No CMAKE_|Unknown CMake command|The system cannot|is not recognized') { $k }
              }
              $shown = @{}
              foreach ($k in (@($idx | Select-Object -First 4))) {
                for ($c = $k; $c -lt [Math]::Min($k + 3, $lines.Count); $c++) {
                  if (-not $shown[$c]) { $shown[$c] = $true; Write-Host "::error::cfg[$c] $($lines[$c])" }
                }
              }
              if ($shown.Count -eq 0) {
                foreach ($line in ($lines | Select-Object -Last 6)) { Write-Host "::error::tail $line" }
              }
              Write-Host "::error::cfg-final exit=$code lines=$($lines.Count) sdkmods=$([bool]$env:PRIMAL_CI_SDK_MODULES) offline=$([bool]$env:PRIMAL_CI_OFFLINE_DEPS) mode=$m"
              exit $code
            }
          } catch {
            Write-Host "::error::cfg-catch $($_.Exception.Message) | at line $($_.InvocationInfo.ScriptLineNumber)"
            exit 1
          }

      - name: Build TestVulkanSponzaRenderGraph
        if: (inputs.mode || 'full') != 'configure'
        shell: powershell
        run: |
          $log = 'build-bvhperf.log'
          cmd /c "cmake --build build-bvhperf --config Release --target TestVulkanSponzaRenderGraph --parallel > $log 2>&1"
          $code = $LASTEXITCODE
          Write-Output "build exit code: $code; log tail:"
          Get-Content $log | Select-Object -Last 40
          if ($code -ne 0) {
            $err = Get-Content $log | Where-Object { $_ -match '(fatal error C\d+|error C\d+|error LNK\d+|error MSB\d+)' }
            if ($err) { $err | Select-Object -First 30 | ForEach-Object { Write-Output $_ } }
            exit $code
          }

      - name: Locate binary
        if: (inputs.mode || 'full') != 'configure'
        shell: powershell
        run: |
          # 候选表对齐 windows-parity（Windows 侧 RUNTIME_OUTPUT_DIRECTORY 在
          # 源码树 Windows\<config>，不在 build 目录内）+ 全工作区递归兜底。
          $cands = @()
          if ($env:PRIMAL_CI_BIN_DIR) { $cands += (Join-Path $env:PRIMAL_CI_BIN_DIR 'TestVulkanSponzaRenderGraph.exe') }
          $cands += 'Windows\Release\TestVulkanSponzaRenderGraph.exe'
          $cands += 'Windows\x64\Release\TestVulkanSponzaRenderGraph.exe'
          $cands += 'build-bvhperf\bin\Release\TestVulkanSponzaRenderGraph.exe'
          $cands += 'build-bvhperf\Release\TestVulkanSponzaRenderGraph.exe'
          $cands += 'build-bvhperf\Tests\Release\TestVulkanSponzaRenderGraph.exe'
          $cands += 'build-bvhperf\EngineTest\IntegrationTests\Release\TestVulkanSponzaRenderGraph.exe'
          $exe = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            $exe = Get-ChildItem -Path . -Recurse -Filter 'TestVulkanSponzaRenderGraph.exe' -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) {
            Write-Host "::error::TestVulkanSponzaRenderGraph.exe not found; probed:"
            $cands | ForEach-Object { Write-Host "::error::cand $_" }
            Select-String -Path 'build-bvhperf.log' -Pattern 'SponzaRenderGraph' -ErrorAction SilentlyContinue |
              Select-Object -First 8 | ForEach-Object { Write-Host "::error::msbuild $($_.Line)" }
            exit 1
          }
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path bvh-out | Out-Null
          Write-Output "[bvh-perf] exe = $exe"
          Write-Output $exe | Out-File -FilePath bvh-out/exe-path.txt -Encoding utf8

      - name: Run perf groups (timing-only, Dynamic GI standard)
        if: (inputs.mode || 'full') != 'configure'
        shell: powershell
        run: |
          $exe = (Get-Content bvh-out/exe-path.txt -Raw).Trim()
          $groups = '${{ inputs.groups }}'
          if (-not $groups) { $groups = 'gi0,dyn-gi,dyn-gi-sah,dyn-gi-upper,dyn-gi-lbvh,dyn-gi-hlbvh' }
          $frames = '${{ inputs.frames }}'
          if (-not $frames) { $frames = '420' }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/perf/run_bvh_perf.ps1 `
            -Binary $exe -OutDir bvh-out -Groups $groups -Frames ([int]$frames)

      - name: Publish report to job summary
        if: always()
        shell: powershell
        run: |
          $md = 'bvh-out/report.md'
          if (Test-Path $md) {
            Get-Content $md -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            "## bvh-perf`n`nreport.md 未生成（见组日志）`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
          if (Test-Path 'bvh-out/meta.txt') {
            "``````" + "`n" + (Get-Content 'bvh-out/meta.txt' -Raw) + "``````" + "`n" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Upload perf evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bvh-perf-${{ github.run_id }}
          path: |
            bvh-out/**
            !bvh-out/**/*.err
            cmake-bvhperf.log
            build-bvhperf.log
          retention-days: 30
          if-no-files-found: warn
