name: CI Dispatcher

# 文件级注释：
# 本工作流仅作为调度器存在于代码分支（master/dev/feature/*）。
# 它不包含具体的构建/测试逻辑，而是调用 cicd 分支上的可复用工作流。

on:
  push:
    branches:
      - master
      - main
      - dev
      - 'feature/**'
      - 'features/**'
  pull_request:
    branches:
      - master
      - main
      - dev
      - 'feature/**'
      - 'features/**'

permissions:
  contents: write

jobs:
  run-ci:
    uses: zhanzhan1848/GameEngine_VulkanCPP/.github/workflows/ci.yml@ci/cicd
    secrets: inherit

  call-push-ci:
    uses: zhanzhan1848/GameEngine_VulkanCPP/.github/workflows/push-ci.yml@ci/cicd
    with:
      skip_python_tests: false
      skip_cpp_sanitize: false
