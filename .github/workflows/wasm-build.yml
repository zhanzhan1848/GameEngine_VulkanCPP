name: WASM Build & Deploy

on:
  push:
    branches:
      - dawn-webgpu-backend
      - features/dawn-webgpu-backend
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Verify Emscripten
        run: emcc --version

      - name: Configure (Emscripten + WebGPU)
        run: |
          emcmake cmake -B build_wasm \
            -DENABLE_WEBGPU=ON \
            -DCMAKE_BUILD_TYPE=MinSizeRel

      - name: Build
        run: cmake --build build_wasm --parallel $(nproc)

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          # CMakeLists.txt sets CMAKE_RUNTIME_OUTPUT_DIRECTORY to WASM/
          cp WASM/TestDawnWASM.js WASM/TestDawnWASM.wasm deploy/ 2>/dev/null || true
          # Also check build_wasm just in case
          find build_wasm -maxdepth 3 \( -name '*.js' -o -name '*.wasm' -o -name '*.data' \) \
            -exec cp {} deploy/ \; 2>/dev/null || true
          # Copy landing page
          if [ -f wasm/index.html ]; then
            cp wasm/index.html deploy/index.html
          fi
          ls -la deploy/

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
