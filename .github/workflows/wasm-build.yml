name: WASM Build & Deploy

on:
  push:
    branches:
      - dawn-webgpu-backend
      - features/dawn-webgpu-backend
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Verify Emscripten
        run: emcc --version

      - name: Cache Emscripten ports
        uses: actions/cache@v4
        with:
          path: ~/.emscripten_cache
          key: emscripten-ports-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            emscripten-ports-${{ runner.os }}-

      - name: Pre-fetch emdawnwebgpu port
        run: embuilder build emdawnwebgpu --force 2>&1 || true

      - name: Configure (Emscripten + WebGPU)
        run: |
          emcmake cmake -B build_wasm \
            -DENABLE_WEBGPU=ON \
            -DCMAKE_BUILD_TYPE=MinSizeRel

      - name: Build
        run: cmake --build build_wasm --parallel $(nproc)

      - name: Patch randomFill for Chrome's resizable ArrayBuffer rejection
        # Emscripten's _random_get passes HEAPU8.subarray() to crypto.getRandomValues.
        # With ALLOW_MEMORY_GROWTH=1 + finite MAXIMUM_MEMORY, HEAPU8 is backed
        # by a resizable ArrayBuffer, which recent Chrome refuses. Newer
        # Emscripten may fix this upstream; until we pin a fixed version,
        # route resizable views through a non-resizable intermediate.
        # Symptom: TypeError "The provided ArrayBufferView value must not
        # be resizable" during JobScheduler init (std::random_device).
        run: |
          python3 - <<'PY'
          import pathlib, re
          for p in pathlib.Path('WASM').glob('TestDawnWASM*.js'):
            src = p.read_text()
            patched = src.replace(
              "return (view) => (crypto.getRandomValues(view), 0);",
              "return (view) => {"
              "  if (view.buffer && view.buffer.resizable) {"
              "    const tmp = new Uint8Array(view.byteLength);"
              "    crypto.getRandomValues(tmp);"
              "    view.set(tmp);"
              "  } else {"
              "    crypto.getRandomValues(view);"
              "  }"
              "  return 0;"
              "};"
            )
            if patched == src:
              print(f"[patch] WARN: pattern not found in {p}")
            else:
              p.write_text(patched)
              print(f"[patch] randomFill rewrote {p}")
          # Also catch the build_wasm output dir as a fallback.
          for p in pathlib.Path('build_wasm').rglob('TestDawnWASM*.js'):
            src = p.read_text()
            patched = src.replace(
              "return (view) => (crypto.getRandomValues(view), 0);",
              "return (view) => {"
              "  if (view.buffer && view.buffer.resizable) {"
              "    const tmp = new Uint8Array(view.byteLength);"
              "    crypto.getRandomValues(tmp);"
              "    view.set(tmp);"
              "  } else {"
              "    crypto.getRandomValues(view);"
              "  }"
              "  return 0;"
              "};"
            )
            if patched != src:
              p.write_text(patched)
              print(f"[patch] randomFill rewrote {p}")
          PY


      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          # CMakeLists.txt sets CMAKE_RUNTIME_OUTPUT_DIRECTORY to WASM/
          cp WASM/TestDawnWASM.js WASM/TestDawnWASM.wasm deploy/ 2>/dev/null || true
          # Also check build_wasm just in case
          find build_wasm -maxdepth 3 \( -name '*.js' -o -name '*.wasm' -o -name '*.data' \) \
            -exec cp {} deploy/ \; 2>/dev/null || true
          # Copy landing page
          if [ -f wasm/index.html ]; then
            cp wasm/index.html deploy/index.html
          fi
          # Copy runtime assets (Sponza model + textures, ~114MB)
          mkdir -p deploy/assets/models/Sponza
          cp EngineTest/assets/Sponza.model deploy/assets/
          cp EngineTest/assets/models/Sponza/*.png deploy/assets/models/Sponza/ 2>/dev/null || true
          echo "=== Deploy contents ==="
          du -sh deploy/
          ls -la deploy/

      - name: Deploy to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
