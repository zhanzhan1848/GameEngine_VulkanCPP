name: Windows CI (Self-Hosted)

# 文件级注释：
# 推送 dev 分支时，在自托管 Windows runner 上编译并运行测试。
# （原触发分支 feat/vulkan-rhi-backend 已合并进 dev，随合并迁移。）
# macOS CI 已全链路移除（费用问题），本仓库不再有 GitHub 托管 macOS runner。
#
# 脚本步骤统一用 shell: powershell（Windows 内置，runner 原生支持）。
# 不要用 shell: bash——自托管机器上默认解析到 C:\Windows\System32\bash.exe（WSL 启动器）；
# 显式指定 Git Bash 路径也不行——路径含空格会触发 runner 的
# "Second path fragment must not be a drive or UNC name" 命令行解析错误。
#
# Runner 机器前置要求（一次性安装）：
#   - Git for Windows（runner 本身也依赖）
#   - CMake >= 3.20（在 PATH 中）
#   - Visual Studio 2022（含 C++ 桌面开发工作负载；不指定 -G，CMake 自动选最新 VS 生成器）
#   - LunarG Vulkan SDK（安装器会设置系统级 VULKAN_SDK 环境变量，find_package(Vulkan) 依赖它）
#   - GitHub Actions runner 以 Windows 服务方式注册（GPU 测试在该会话下窗口不可见，但可正常执行）

on:
  push:
    branches:
      - dev
  workflow_dispatch: {}

permissions:
  contents: read

# 同一分支快速连续推送时，取消旧的排队/运行任务，避免单台 runner 被积压
concurrency:
  group: windows-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 编译前校验门禁：YAML/冲突标记/脚本语法/.gitmodules/configure 冒烟/
  # ctest 注册数，全部通过才进入自托管构建（省 runner 时间，坏提交直接挡下）。
  preflight:
    name: 编译前校验
    uses: ./.github/workflows/ci-preflight.yml

  build-and-test:
    name: 编译与测试 (Windows / MSVC / Vulkan)
    needs: preflight
    runs-on: [self-hosted, Windows, x64]
    timeout-minutes: 120

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # 自托管 runner 保留工作区，让 build/ 可以增量编译。
          # 默认 clean:true 会执行 git clean -ffdx，每次推送都清空构建目录导致全量重编。
          clean: false

      - name: 初始化必需的 submodule
        shell: powershell
        # 注意：run 块内容必须纯 ASCII。runner 写出的 .ps1 无 BOM，
        # 中文系统的 PowerShell 5.1 按 GBK 解码非 ASCII 字符会乱码并引发解析错误。
        run: |
          # Only fetch submodules needed by the native Windows build
          # (root CMakeLists FATAL_ERRORs without meshoptimizer).
          # Skip dawn/PhysX/WebGPU/astc-encoder: only used by WASM/WebGPU
          # builds; dawn alone is multi-GB.
          $submodules = @(
            'third_party/meshoptimizer',
            'third_party/stb',
            'third_party/moodycamel-ConcurrentQueue',
            'third_party/lua'
          )
          git submodule update --init @submodules

      - name: 打印环境信息
        shell: powershell
        run: |
          if ($env:VULKAN_SDK) {
            Write-Host "VULKAN_SDK = $env:VULKAN_SDK"
          } else {
            Write-Host "VULKAN_SDK not set (find_package(Vulkan) may still find the SDK via default install paths)"
          }
          cmake --version
          git --version

      - name: 配置 CMake (Release + Vulkan RHI)
        shell: powershell
        run: |
          # No -G: CMake picks the newest installed Visual Studio generator
          # (multi-config). ENABLE_VULKAN=ON enables
          # Engine/Graphics/RHI/Platforms/Vulkan, find_package(Vulkan REQUIRED)
          # and all TestVulkan* targets.
          # BUILD_CONTENT_TOOLS=OFF skips ContentTools (its Windows build needs
          # FBX SDK + DirectXTex which are not installed on this runner) and
          # the legacy TestRenderer integration test that links it.
          # Vulkan RHI coverage comes from Engine + TestVulkan* unit tests.
          # To pin a generator use: -G "Visual Studio 17 2022" -A x64
          cmake -S . -B build -DENABLE_VULKAN=ON -DBUILD_CONTENT_TOOLS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: 编译 (Release)
        shell: powershell
        run: |
          # Build via cmd so stdout+stderr land in one log file verbatim
          # (PowerShell 5.1 native 2>&1 wraps stderr lines in ErrorRecords).
          # Full log is echoed back so the Actions console log stays complete.
          cmd /c "cmake --build build --config Release --parallel > msbuild-full.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content msbuild-full.log
          exit $code

      - name: 提取编译错误摘要
        if: failure()
        shell: powershell
        run: |
          # Digest MSVC diagnostics from the full build log: every error line
          # goes to msbuild-errors.log, and a grouped-by-error-code summary is
          # appended to the run summary page.
          if (-not (Test-Path msbuild-full.log)) { Write-Host 'no build log found'; exit 0 }
          $lines = Get-Content msbuild-full.log
          $err = $lines | Where-Object { $_ -match '(fatal error C\d+|error C\d+|error LNK\d+|LNK\d{4}|error MSB\d+)' }
          if (-not $err) { Write-Host 'no compile errors found in log'; exit 0 }
          $err | Set-Content msbuild-errors.log

          $codes = $err | ForEach-Object {
              if ($_ -match '(?:fatal error |error )(C\d+|LNK\d+|MSB\d+)') { $Matches[1] }
          }
          $summary = "### Compile errors: $($err.Count) lines`n`n"
          $summary += "| Code | Count |`n|---|---|`n"
          $codes | Group-Object | Sort-Object Count -Descending | ForEach-Object {
              $summary += "| $($_.Name) | $($_.Count) |`n"
          }
          $summary += "`n<details><summary>First 80 error lines</summary><pre>`n"
          $err | Select-Object -First 80 | ForEach-Object { $summary += "$_`n" }
          $summary += "</pre></details>`n"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          Write-Host $summary

      - name: 运行测试 (ctest)
        shell: powershell
        run: |
          # Run all registered tests (unit + integration + TestVulkan*).
          # --timeout guards against windowed graphics tests hanging in a
          # non-interactive session.
          # To exclude flaky tests add: -E "TestVulkanStress|..."
          ctest --test-dir build -C Release --output-on-failure --timeout 600 --no-tests=error

      - name: 上传日志制品（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: |
            msbuild-full.log
            msbuild-errors.log
            build/Testing/**/*.log
            build/Testing/**/*.xml
          if-no-files-found: ignore
          retention-days: 14
