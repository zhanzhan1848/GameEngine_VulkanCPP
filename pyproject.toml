[project]
name = "gameengine-fbx-tools"
version = "0.1.0"
description = "FBX model inspection tools for Game Engine"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.24.4",
    "pillow>=10.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ContentTools"]

[tool.uv]
dev-dependencies = []
