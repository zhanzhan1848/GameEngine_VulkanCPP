<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Engine Demos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0f0f1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    #tabs {
      display: flex;
      gap: 0;
      background: #16162a;
      border-bottom: 1px solid #2a2a4a;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .tab {
      padding: 12px 20px;
      cursor: pointer;
      color: #888;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }

    .tab:hover { color: #c0c0c0; }

    .tab.active {
      color: #00d4ff;
      border-bottom-color: #00d4ff;
    }

    #frame-wrap {
      position: relative;
      width: 100%;
      flex: 1;
      overflow: hidden;
    }

    #frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    #switch-overlay {
      position: absolute;
      inset: 0;
      background: #0f0f1a;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
      pointer-events: none;
      z-index: 10;
    }

    #switch-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2a2a4a;
      border-top-color: #00d4ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #fallback {
      padding: 40px;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="tabs">
    <div class="tab active" data-src="wfc/shell.html">WFC 演示</div>
    <div class="tab"        data-src="wasm/index.html">基础渲染</div>
  </div>
  <div id="frame-wrap">
    <iframe id="frame" src="wfc/shell.html"></iframe>
    <div id="switch-overlay">
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    (function() {
      // WebGPU feature check — bail early with a friendly message.
      if (!navigator.gpu) {
        document.getElementById('frame-wrap').innerHTML =
          '<div id="fallback">当前浏览器不支持 WebGPU。<br>' +
          '请使用 Chrome 113+ / Edge 113+ 桌面版。</div>';
        return;
      }

      var TABS = document.querySelectorAll('.tab');
      var FRAME = document.getElementById('frame');
      var OVERLAY = document.getElementById('switch-overlay');
      var FALLBACK_TIMEOUT_MS = 5000;
      var fallbackTimer = null;

      function showOverlay() {
        OVERLAY.classList.add('show');
        // Defensive: if the child never signals, lift overlay anyway so the
        // user sees the (possibly broken) child state instead of a frozen parent.
        clearTimeout(fallbackTimer);
        fallbackTimer = setTimeout(hideOverlay, FALLBACK_TIMEOUT_MS);
      }

      function hideOverlay() {
        OVERLAY.classList.remove('show');
        clearTimeout(fallbackTimer);
      }

      TABS.forEach(function(tab) {
        tab.addEventListener('click', function() {
          if (tab.classList.contains('active')) return;
          TABS.forEach(function(t) { t.classList.remove('active'); });
          tab.classList.add('active');
          showOverlay();
          FRAME.src = tab.dataset.src;
        });
      });

      // Child iframes postMessage on hideLoading() to lift the overlay.
      window.addEventListener('message', function(e) {
        if (!e.data) return;
        if (e.data.type === 'wfc-loaded' || e.data.type === 'forward-loaded') {
          hideOverlay();
        }
      });

      // Show overlay during the initial iframe load too.
      showOverlay();
    })();
  </script>
</body>
</html>
